name: Build KokosClient

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Setup Gradle
      run: |
        mkdir -p gradle/wrapper
        wget https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
        wget https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.properties -O gradle/wrapper/gradle-wrapper.properties
        wget https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradlew -O gradlew
        wget https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradlew.bat -O gradlew.bat
        chmod +x gradlew
    
    - name: Build
      run: ./gradlew build
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: KokosClient
        path: build/libs/*.jar
